[project]
name = "market-storage"
version = "0.1.0"
description = "Independent durable market input storage and SSH snapshot transfer"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gex-pull = "market_storage.download:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "black==26.5.1", "ruff>=0.17.4", "basedpyright>=1.40.2"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=market_storage --cov-branch --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "module: storage subsystem with real SQLite",
    "integration: independently implemented components working together",
    "e2e: complete CLI transfer workflow",
]

[tool.coverage.run]
branch = true
source = ["market_storage"]

[tool.coverage.report]
fail_under = 92
precision = 2

[tool.black]
line-length = 80
target-version = ["py314"]
preview = true
unstable = true

[tool.ruff]
line-length = 80
target-version = "py314"
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # PT009 prescribes pytest's rewritten assert statements; S101 forbids
    # that assertion form. Keep PT009 and use explicit production validation.
    "assert",
    # D203 requires a blank line before class docstrings; D211 forbids it.
    "incorrect-blank-line-before-class",
    # D213 requires summaries on line two; D212 requires the first line.
    "multi-line-summary-second-line",
    # Black controls trailing commas and can remove a comma COM812 requires.
    "missing-trailing-comma",
    # Black can emit adjacent string literals on the same line.
    "single-line-implicit-string-concatenation",
    # Explicit re-export aliases are required by the type checker.
    "useless-import-alias",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3
max-branches = 12
max-locals = 15
max-statements = 50
max-returns = 6
max-bool-expr = 5
max-nested-blocks = 3

[tool.basedpyright]
pythonVersion = "3.14"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "all"
failOnWarnings = true
reportAny = "error"
reportExplicitAny = "error"
enableTypeIgnoreComments = false
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# Black emits adjacent string literals when wrapping text.
reportImplicitStringConcatenation = "none"
